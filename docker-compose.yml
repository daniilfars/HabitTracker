services:
  webapi:
    image: ${DOCKER_REGISTRY-}webapi
    build:
      context: .
      dockerfile: WebAPI/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=HabitTracker;Username=postgres;Password=password
      - JwtSettings__SecretKey=your-very-long-secret-key-min-32-characters
      - JwtSettings__Issuer=HabitTracker
      - JwtSettings__Audience=HabitTracker
      - JwtSettings__ExpiryMinutes=15
      - Serilog__WriteTo__0__Args__serverUrl=http://seq:5341
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
      seq:
        condition: service_started
  db:
    image: postgres:15
    container_name: habittracker-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: HabitTracker
    ports:
      - "5433:5432"
    volumes:
      - habittracker_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  seq:
    image: datalust/seq:latest
    container_name: habittracker-seq
    environment:
      - ACCEPT_EULA=Y
    ports:
      - "5341:80"
    volumes:
      - habittracker_seq_data:/data
volumes:
  habittracker_postgres_data:
  habittracker_seq_data: